services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    restart: unless-stopped

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_TUNNEL_URL_FILE: /qr-data/tunnel-url.txt
      APP_TUNNEL_QR_FILE: /qr-data/qr-code.png
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    volumes:
      - qr-data:/qr-data

  qr-watcher:
    build: ./scripts/qr-watcher
    depends_on:
      app:
        condition: service_started
    environment:
      TUNNEL_HOST: "http://app:8080"
      QR_OUTPUT_DIR: "/qr-data"
      FORM_PATH: "/request-form"
    volumes:
      - qr-data:/qr-data
    restart: unless-stopped

volumes:
  mysql_data:
  qr-data:
