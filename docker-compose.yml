services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8081:80"
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # This local container serves plain PostgreSQL, so TLS is switched off.
      # The default `prefer` in application.properties would also cope.
      DB_SSLMODE: disable
      # The `postgres` volume starts empty, so the migrations have to run to
      # create the schema. The `local` profile disables baselining to allow it.
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Google sign-in. Must be listed here explicitly: Compose only passes
      # variables that appear in this block, so the server reports
      # "Google sign-in is not configured" when these are missing.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_ALLOWED_STAFF_EMAILS: ${GOOGLE_ALLOWED_STAFF_EMAILS}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_TUNNEL_URL_FILE: /qr-data/tunnel-url.txt
      APP_TUNNEL_QR_FILE: /qr-data/qr-code.png
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      TZ: Asia/Bangkok
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER}
    volumes:
      - qr-data:/qr-data

  qr-watcher:
    build: ./scripts/qr-watcher
    depends_on:
      app:
        condition: service_started
    environment:
      TUNNEL_HOST: "http://app:8080"
      QR_OUTPUT_DIR: "/qr-data"
      FORM_PATH: "/request-form"
    volumes:
      - qr-data:/qr-data
    restart: unless-stopped

volumes:
  postgres_data:
  qr-data:
