spring.application.name=spring_boot_project_api

# spring.datasource.url=jdbc:mysql://localhost:3308/Glasses Mangement
# spring.datasource.username=root
# spring.datasource.password=rootpass
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.config.import=optional:file:.env[.properties]

logging.level.org.springframework.security=DEBUG

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:glasses_management}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.forward-headers-strategy=native
server.address=0.0.0.0

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

app.base-url=${APP_BASE_URL:http://localhost:8080}

# Cloudflare tunnel: qr-watcher writes URL + QR PNG to these paths
app.tunnel.url-file=${APP_TUNNEL_URL_FILE:}
app.tunnel.qr-file=${APP_TUNNEL_QR_FILE:}

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:attachments}
