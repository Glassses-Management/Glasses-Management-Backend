spring.application.name=spring_boot_project_api

spring.config.import=optional:file:.env[.properties],optional:classpath:.env[.properties]

# PostgreSQL (Aiven). Copy host, port, database, user and password from the
# Aiven service's connection string:
#   postgresql://USER:PASSWORD@HOST:PORT/DATABASE?sslmode=require
# sslmode defaults to `prefer`, which negotiates TLS when the server offers it
# and quietly falls back to plaintext when it does not. That is the one setting
# that works for both Aiven (which refuses plaintext) and a local database.
# Set DB_SSLMODE=require if you want TLS enforced rather than merely attempted.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:glasses_management}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
# V1-V10 were originally written for MySQL. They were applied there, and that
# history travels with the data whenever it is moved to a new host (pgloader or
# pg_dump/pg_restore both copy flyway_schema_history). The migration files are
# now PostgreSQL, so their checksums no longer match the recorded ones.
# Checksum validation is therefore off: it would otherwise refuse to start.
# Re-enable it once the history has been realigned with `flyway repair`.
spring.flyway.validate-on-migrate=false
# The database already contains the schema, so never let Flyway try to build it:
# baseline an existing database at V10, meaning V1-V10 count as already applied.
# A brand new empty database must instead run V1-V10, so start those with the
# `local` profile (see application-local.properties).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=10
spring.jpa.hibernate.ddl-auto=validate
# pgloader did not put the tables in `public`: it created a schema named after
# the old MySQL database and loaded everything there. Point both Hibernate and
# Flyway at it so they find the existing tables and history.
spring.jpa.properties.hibernate.default_schema=glasses_management
spring.flyway.schemas=glasses_management
spring.flyway.default-schema=glasses_management
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# `user` is a reserved word in PostgreSQL, so it can only be referenced when it
# is quoted. Quoting every identifier lets User keep its original
# @Table(name = "user") and still match the table pgloader created.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

logging.level.org.springframework.security=DEBUG

server.forward-headers-strategy=native
server.address=0.0.0.0
server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS1mb3Itd2RqLXRva2VuLTIwMjY=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

app.base-url=${APP_BASE_URL:http://localhost:8080}

# Google sign-in. The client id is public (it ships in the browser bundle); no
# client secret is used, because the frontend only hands over the ID token and
# this server verifies it against Google's keys.
app.google.client-id=${GOOGLE_CLIENT_ID:}
# Comma-separated emails allowed to sign in with Google using a staff role.
# Empty means no staff account can use Google sign-in at all.
app.google.allowed-staff-emails=${GOOGLE_ALLOWED_STAFF_EMAILS:}

app.tunnel.url-file=${APP_TUNNEL_URL_FILE:}
app.tunnel.qr-file=${APP_TUNNEL_QR_FILE:}

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Set to false to skip seeding sample products on startup
app.seed-products=${SEED_PRODUCTS:true}

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:attachments}
