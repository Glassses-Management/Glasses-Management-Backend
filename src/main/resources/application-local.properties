# Profile for building a brand new, empty database from the migration files.
# Run with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# The default profile is tuned for a database that already holds data (anything
# moved over from MySQL). It baselines an existing schema at V10 so Flyway never
# tries to recreate tables that are already there. That is wrong for an empty
# database, where the migrations must actually run - which is what this profile
# does by turning baselining off.
spring.flyway.baseline-on-migrate=false
