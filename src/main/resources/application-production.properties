# Production overrides. Activated by SPRING_PROFILES_ACTIVE=production, which the
# Dockerfile sets. Keep this file limited to settings that must differ from
# development; everything shared lives in application.properties.

# SQL logging is useful locally but noisy in production, and it writes row data
# into the platform's log stream. Turn both off.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Spring Security DEBUG logging is for local troubleshooting only. At DEBUG the
# logs include every request's filter chain decision, which is both noisy and a
# good way to fill a free-tier log quota.
logging.level.org.springframework.security=INFO
